services:
  - type: web
    name: moon-gallery-entrance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-chat
